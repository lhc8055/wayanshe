      '<button data-act="sleep">睡一会</button>' +
      '<button data-act="hide">隐藏宠物</button>' +
    '</div>';
  anchor.appendChild(menu);
  var back = document.createElement('button');
  back.id = 'wysPetBack'; back.type = 'button'; back.textContent = '召唤';
  back.setAttribute('aria-label', '显示宠物');

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(shade);
    document.body.appendChild(anchor);
    document.body.appendChild(back);
  }

  /* ---------- 运行时 ---------- */
  var pet, wrap, scaler, zzz, sayEl;
  var dpr = window.devicePixelRatio || 1;
  var scale = 0.5;
  var state = 'idle', stateStart = 0, speed = 1;
  var pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
  var target = null, airborne = false;
  var dragging = false, moved = false, grab = { dx: 0, dy: 0 };
  var downPoint = { x: 0, y: 0 }, dragSamples = [], prevX = -1;
  var sleeping = false, sleepStart = 0;
  var lastInput = 0, nextCasual = 0;
  var lastTap = -1e9, tapStreak = 0, tapTimer = 0, longTimer = 0, sayTimer = 0, fadeT = 0, hideT = 0;
  var lastFrame = 0, rafId = 0, running = false, inited = false;
  var painted = { row: -1, frame: -1 };
  var transformDirty = true;
  var menuOpen = false, suppressTap = false;
  var hidden = lsGet('wys_pet_hidden') === '1';
  var enter = null;                      // {from,to,y,t0,dur}

  function viewW() { return document.documentElement.clientWidth || window.innerWidth || 0; }
  function viewH() {
    var vv = window.visualViewport;
    return (vv && vv.height) || document.documentElement.clientHeight || window.innerHeight || 0;
  }
  function isMobile() { return viewW() <= 760; }
  /* 底部预留：贴住 dock 上沿，比上一版更低 */
  function bottomReserve() { return (isMobile() ? 92 : 58); }
  function petW() { return FRAME_W * scale; }
  function petH() { return FRAME_H * scale; }
  function maxX() { return Math.max(0, viewW() - petW() - 10); }
  function maxY() { return Math.max(0, viewH() - petH() - bottomReserve()); }

  /* 目标显示宽度：桌面 88 / 手机 80，比上一版收小；跨设备一致 */
  function pickScale() {
    dpr = window.devicePixelRatio || 1;
    return (isMobile() ? 80 : 88) / FRAME_W;
  }

  function clampPos() {
    if (pos.x < 6) pos.x = 6;
    if (pos.y < 6) pos.y = 6;
    if (pos.x > maxX()) pos.x = maxX();
    if (pos.y > maxY()) pos.y = maxY();
  }
  /* 位移与缩放分离：气泡/zzz 不随宠物缩放，保证文字清晰 */
  function applyScale() {
    wrap.style.width = petW() + 'px';
    wrap.style.height = petH() + 'px';
    scaler.style.transform = 'scale(' + scale + ')';
  }
  function applyTransform() {
    if (!transformDirty) return;
    transformDirty = false;
    var x = Math.round(pos.x * dpr) / dpr;
    var y = Math.round(pos.y * dpr) / dpr;
    wrap.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
  }
  function paint(row, frame) {
    if (painted.row === row && painted.frame === frame) return;
    painted.row = row; painted.frame = frame;
    pet.style.backgroundPosition = (-frame * FRAME_W) + 'px ' + (-row * FRAME_H) + 'px';
  }

  function home() {
    pos.x = maxX(); pos.y = maxY();
    transformDirty = true; applyTransform();
  }
  function restorePos() {
    var saved = lsGet('wys_pet_pos');
    if (saved) {
      try {
        var p = JSON.parse(saved);
        if (p && isFinite(p.x) && isFinite(p.y)) { pos.x = p.x; pos.y = p.y; }
      } catch (e) {}
    }
    if (!pos.x && !pos.y) home();
    clampPos(); transformDirty = true; applyTransform();
  }
  function savePos() { lsSet('wys_pet_pos', JSON.stringify({ x: Math.round(pos.x), y: Math.round(pos.y) })); }

  /* ---------- 状态机 ---------- */
  function setState(name, force) {
    if (!STATES[name] || (name === state && !force)) return;
    state = name; stateStart = performance.now(); painted.row = -1;
  }
  function chooseNext() {
    if (airborne) return 'fly';
    if (sleeping) return 'waiting';
    return 'idle';
  }
  function say(text, ms) {
    sayEl.textContent = text;
    sayEl.classList.add('on');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { sayEl.classList.remove('on'); }, ms || 1200);
  }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function goSleep() {
    if (dragging || airborne) return;
    sleeping = true; sleepStart = performance.now(); speed = 0.5;
    zzz.classList.add('on');
    setState('waiting', true);
    say('zzz…', 1400);
  }
  function wake(quiet) {
    if (!sleeping) return;
    sleeping = false; speed = 1;
    zzz.classList.remove('on');
    if (state === 'waiting') setState('idle', true);
    if (!quiet) say('被吵醒了…', 1000);
  }

  /* ---------- 出场：从屏幕右侧外走回默认位置 ---------- */
  function startEntrance() {
    if (enter || reduced || hidden || document.hidden) return;
    var destX = pos.x, destY = pos.y;
    if (destX > maxX()) destX = maxX();
    pos.x = viewW() + petW() * 0.55;     // 起始点完全在屏幕外
    pos.y = destY;
    transformDirty = true; applyTransform();

    var dist = pos.x - destX;
    var dur = Math.max(1.15, Math.min(2.2, dist / 230));   // 秒，速度约 230px/s
    enter = { from: pos.x, to: destX, y: destY, t0: performance.now(), dur: dur };
    setState('runLeft', true);
    say('来啦～', 900);
  }
  function finishEntrance() {
    if (!enter) return;
    pos.x = enter.to; pos.y = enter.y; enter = null;
    transformDirty = true; applyTransform();
    setState('idle', true);
  }

  /* ---------- 抛掷物理 ---------- */
  function physicsStep(dt) {
    vel.y += 2400 * dt;
    pos.x += vel.x * dt;
    pos.y += vel.y * dt;
    var mx = maxX(), my = maxY();
    if (pos.x < 0) { pos.x = 0; vel.x = -vel.x * 0.55; }
    if (pos.x > mx) { pos.x = mx; vel.x = -vel.x * 0.55; }
    if (pos.y < 0) { pos.y = 0; vel.y = Math.abs(vel.y) * 0.4; }
    if (pos.y >= my) {
      pos.y = my;
      if (Math.abs(vel.y) < 280) {
        airborne = false; vel.x = vel.y = 0;
        setState('jumping', true); say('咚…', 700); savePos();
      } else { vel.y = -vel.y * 0.5; vel.x *= 0.8; }
    }
    transformDirty = true;
  }
  function maybeCasual(now) {
    if (reduced || dragging || sleeping || airborne || target || enter) return;
    if (state !== 'idle') return;
    if (now - lastInput < 20000 || now < nextCasual) return;
    setState(pick(CASUAL), true);
    if (Math.random() < 0.3) say(pick(['来看攻略呀', '好无聊…', '摸我一下嘛']), 1400);
    nextCasual = now + 22000 + Math.random() * 20000;
  }

  /* ---------- 主循环（页面隐藏即暂停；无变化不重绘） ---------- */
  function tick(now) {
    rafId = requestAnimationFrame(tick);

    if (enter) {
      var t = Math.min(1, (now - enter.t0) / (enter.dur * 1000));
      var e = -(Math.cos(Math.PI * t) - 1) / 2;            // easeInOutSine，起步/收尾都顺
      pos.x = enter.from + (enter.to - enter.from) * e;
      pos.y = enter.y;
      transformDirty = true;
      if (t >= 1) finishEntrance();
    }

    var st = STATES[state];
    var elapsed = (now - stateStart) / speed;
    var f = Math.floor(elapsed / (st.duration / st.frames));
    if (st.loop) paint(st.row, f < 0 ? 0 : f % st.frames);
    else if (f >= st.frames) { setState(chooseNext(), true); return; }
    else paint(st.row, f < 0 ? 0 : f);

    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (airborne) physicsStep(dt);
    applyTransform();
    maybeCasual(now);
    if (sleeping && now - sleepStart > 25000) { wake(true); say('睡饱了～', 900); }
  }
  function start() {
    if (running || hidden || document.hidden) return;
    running = true;
    lastFrame = stateStart = performance.now();
    lastInput = lastFrame;
    nextCasual = lastFrame + 25000;
    painted.row = -1;
    rafId = requestAnimationFrame(tick);
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  /* ---------- 指针交互（仅宠物自身） ---------- */
  function onDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    closeMenu();
    if (enter) finishEntrance();          // 出场中一碰就直接落位
    wake(true);
    lastInput = performance.now();
    dragging = true; moved = false; suppressTap = false;
    grab.dx = e.clientX - pos.x; grab.dy = e.clientY - pos.y;
    downPoint.x = e.clientX; downPoint.y = e.clientY;
    prevX = e.clientX;
    dragSamples = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
    pet.classList.add('dragging');
    try { pet.setPointerCapture(e.pointerId); } catch (err) {}
    clearTimeout(longTimer);
    longTimer = setTimeout(function () {
      if (dragging && !moved) {
        dragging = false;
        pet.classList.remove('dragging');
        goSleep();
      }
    }, 700);
  }
  function onMove(e) {
    if (!dragging) return;
    lastInput = performance.now();
    if (!moved && (Math.abs(e.clientX - downPoint.x) > 6 || Math.abs(e.clientY - downPoint.y) > 6)) {
      moved = true; clearTimeout(longTimer);
    }
    if (!moved) return;
    pos.x = e.clientX - grab.dx;
    pos.y = e.clientY - grab.dy;
    clampPos(); transformDirty = true;
    if (!running) applyTransform();

    /* 拖拽方向决定奔跑朝向：往右拖 → runRight，往左拖 → runLeft */
    if (!reduced && prevX >= 0) {
      var dx = e.clientX - prevX;
      if (Math.abs(dx) >= 0.8) {
        var want = dx > 0 ? 'runRight' : 'runLeft';
        if (state !== want) setState(want, true);
      }
    }
    prevX = e.clientX;

    dragSamples.push({ t: performance.now(), x: e.clientX, y: e.clientY });
    if (dragSamples.length > 6) dragSamples.shift();
  }
  function sampleVelocity() {
    if (dragSamples.length < 2) return { x: 0, y: 0 };
    var a = dragSamples[dragSamples.length - 2], b = dragSamples[dragSamples.length - 1];
    var dt = Math.max(8, b.t - a.t) / 1000, cap = 1400;
    return {
      x: Math.max(-cap, Math.min(cap, (b.x - a.x) / dt)),
      y: Math.max(-cap, Math.min(cap, (b.y - a.y) / dt))
    };
  }
  function onUp(e) {
    if (!dragging) { suppressTap = false; return; }
    var wasMoved = moved;
    dragging = false; moved = false; prevX = -1;
    pet.classList.remove('dragging');
    clearTimeout(longTimer);
    try { pet.releasePointerCapture(e.pointerId); } catch (err) {}
    if (suppressTap) { suppressTap = false; return; }
    if (wasMoved) {
      if (reduced) { savePos(); return; }
      var v = sampleVelocity();
      vel.x = v.x; vel.y = v.y;
      airborne = true; target = null;
      setState('fly', true);
      if (Math.abs(v.x) + Math.abs(v.y) > 300) say(pick(['哇——', '放开我！', '飞起！']), 900);
    } else onTap();
  }
  function onTap() {
    var now = performance.now();
    lastInput = now;
    if (reduced) { say(pick(['喵～', '嗯？', '在呢']), 1000); return; }
    if (now - lastTap < 300) {
      clearTimeout(tapTimer); lastTap = -1e9; tapStreak = 0;
      setState('running', true); say('跑给你看！', 900);
      return;
    }
    if (now - lastTap > 700) tapStreak = 0;
    lastTap = now; tapStreak++;
    if (tapStreak >= 5) {
      tapStreak = 0;
      setState('failed', true); say('别戳了！', 1200);
      return;
    }
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () {
      if (performance.now() - lastTap < 260) return;
      setState(Math.random() < 0.5 ? 'waving' : 'review', true);
      say(pick(['喵～', '摸头要轻一点', '嗯？', '再摸一下']), 1100);
    }, 260);
  }

  /* ---------- 菜单：贴着宠物上方弹出，不遮住宠物、不被底部导航裁掉 ---------- */
  /* 菜单：圆形光球从宠物身上飞向窗口位置并被窗口盖住，窗口随即展开 */
  var MENU_W = 136, MENU_H = 158;
  function visW() {
    var vv = window.visualViewport;
    var w = viewW();
    if (vv && vv.width) w = Math.min(w, vv.width);
    if (window.innerWidth) w = Math.min(w, window.innerWidth);
    return w;
  }
  function placeMenu() {
    var mw = MENU_W, mh = MENU_H;
    var cx = pos.x + petW() / 2;
    cx = Math.max(mw / 2 + 8, Math.min(visW() - mw / 2 - 8, cx));
    var up = pos.y + 10;                                    // 面板底边贴着宠物头顶（压在精灵留白上）
    var down = pos.y + petH() + 2;
    var flip = up - mh < 8 && viewH() - down > mh + 8;      // 头顶没空间就朝下展开
    anchor.style.left = Math.round(cx) + 'px';
    anchor.style.top = Math.round(flip ? down : up) + 'px';
    anchor.style.transform = flip ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
    anchor.style.transform = flip ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
    return { cx: cx, edge: flip ? down : up };
  }
  function openMenu() {
    clearTimeout(longTimer);
    if (dragging) { dragging = false; pet.classList.remove('dragging'); }
    suppressTap = true;
    if (menuOpen) { placeMenu(); return; }
    menuOpen = true;
    clearTimeout(fadeT); clearTimeout(hideT);
    menu.classList.remove('open');
    menu.classList.remove('fading');
    placeMenu();
    menu.classList.add('show');
    document.documentElement.classList.add('wysPetOpen');   // 遮罩盖住整页，只留 dock 可点
    shade.classList.add('on');
    requestAnimationFrame(function () {
      if (menuOpen) menu.classList.add('open');             // 从宠物身上那颗小球长成窗口
    });
  }
  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    menu.classList.remove('open');                          // 先缩回小球
    shade.classList.remove('on');
    document.documentElement.classList.remove('wysPetOpen');
    clearTimeout(fadeT); clearTimeout(hideT);
    fadeT = setTimeout(function () { if (!menuOpen) menu.classList.add('fading'); }, 250);   // 再缓缓淡掉
    hideT = setTimeout(function () {
      if (!menuOpen) { menu.classList.remove('show'); menu.classList.remove('fading'); }
    }, 580);
  }
  function setHidden(v) {
    hidden = v;
    lsSet('wys_pet_hidden', v ? '1' : '0');
    layer.style.display = v ? 'none' : '';
    back.classList.toggle('on', v);
    if (v) { stop(); closeMenu(); }
    else {
      transformDirty = true; applyTransform();
      start();
      home(); startEntrance();          // 召唤也走一遍出场
    }
  }

  function bind() {
    pet.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    pet.addEventListener('contextmenu', function (e) { e.preventDefault(); openMenu(); });
    document.addEventListener('pointerdown', function (e) {
      if (!menu.contains(e.target) && e.target !== pet) closeMenu();
    }, true);
    menu.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      closeMenu(); wake(true);
      lastInput = performance.now();
      if (act === 'jump') setState('jumping', true);
      if (act === 'wave') setState('waving', true);
      if (act === 'sleep') goSleep();
      if (act === 'hide') setHidden(true);
    });
    /* 点在遮罩上才关（用 click，避免 pointerdown 先关掉导致这一下漏到下面的按钮） */
    shade.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); closeMenu(); });
    /* 兜底：菜单打开期间，遮罩以外的一切点击都不往下传 */
    document.addEventListener('click', function (e) {
      if (!menuOpen) return;
      var t = e.target;
      if (menu.contains(t) || back.contains(t) || layer.contains(t)) return;
      if (shade.contains(t) || (dock && dock.contains(t))) return;
      e.stopPropagation(); e.preventDefault();
    }, true);
    back.addEventListener('click', function () { setHidden(false); });
    window.addEventListener('hashchange', closeMenu);   // 点 dock 切页时收起菜单
    window.addEventListener('resize', function () {
      scale = pickScale(); applyScale();
      if (enter) enter.to = maxX();
      clampPos(); transformDirty = true; applyTransform();
      if (menuOpen) placeMenu();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        clampPos(); transformDirty = true; applyTransform();
        if (menuOpen) placeMenu();
      });
    }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop();
      else if (!hidden && !reduced) start();
    });
    window.addEventListener('pagehide', stop);
  }

  /* ---------- 启动：等主站加载完再拉图，不抢首屏 ---------- */
  function boot() {
    if (inited) return;
    inited = true;
    mount();
    pet = document.getElementById('wysPet');
    wrap = document.getElementById('wysPetWrap');
    scaler = document.getElementById('wysPetScale');
    zzz = document.getElementById('wysPetZzz');
    sayEl = document.getElementById('wysPetSay');
    scale = pickScale();
    applyScale();
    home(); restorePos();
    layer.style.display = hidden ? 'none' : '';
    back.classList.toggle('on', hidden);
    paint(0, 0);
    bind();
    var img = new Image();
    img.onload = function () {
      pet.classList.add('ready');
      if (hidden) return;
      start();
      startEntrance();
    };
    img.onerror = function () {
      layer.style.display = 'none';
      back.classList.remove('on');
      if (window.console) console.warn('[wysPet] 精灵图加载失败: ' + SPRITE);
    };
    img.src = SPRITE;
  }
  if (document.readyState === 'complete') setTimeout(boot, 600);
  else window.addEventListener('load', function () { setTimeout(boot, 600); });
})();
</script>
</body>
</html>
