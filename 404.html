
<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>瓦研社 · 无畏契约手游攻略</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22250%20190%20756%20480%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fff6dd%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23ecd7a6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23bf9552%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%22250%22%20y%3D%22190%22%20width%3D%22756%22%20height%3D%22480%22%20rx%3D%2290%22%20fill%3D%22%2306060a%22/%3E%3Cg%20fill%3D%22%23eeeef2%22%3E%3Cpath%20d%3D%22M296%20276%20L473%20473%20L404%20551%20L296%20446Z%22/%3E%3Cpath%20d%3D%22M960%20276%20L783%20473%20L852%20551%20L960%20446Z%22/%3E%3C/g%3E%3Cg%20fill%3D%22url%28%23g%29%22%3E%3Cpath%20d%3D%22M535%20281%20L653%20410%20L599%20410%20L536%20342Z%22/%3E%3Cpath%20d%3D%22M721%20281%20L718%20344%20L694%20369%20L640%20369Z%22/%3E%3Cpath%20d%3D%22M455%20363%20L514%20364%20L577%20433%20L577%20469%20L518%20532%20L463%20532%20L536%20450Z%22/%3E%3Cpath%20d%3D%22M801%20363%20L743%20364%20L679%20433%20L679%20469%20L738%20532%20L793%20532%20L720%20450Z%22/%3E%3Cpath%20d%3D%22M536%20567%20L602%20495%20L654%20495%20L720%20567%20L722%20629%20L628%20530%20L534%20629Z%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#06060a;--panel:#0e0e13;--panel2:#15151c;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --red:#ff3b52;--red2:#c4162e;--gold:#e8c680;--silver:#e9eaef;
  --txt:#f2f2f6;--mut:#9a9aa8;--dim:#62626f;
  --ease:cubic-bezier(.22,1,.36,1);
  --en:"Bahnschrift","DIN Alternate","Rajdhani","Arial Narrow","Segoe UI",sans-serif;
  --safeB:0px;
  --hh:60px;
  --cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}
ul{list-style:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vw 42vh at 100% 0,rgba(255,59,82,.13),transparent 70%),
  radial-gradient(50vw 40vh at 0 100%,rgba(255,59,82,.07),transparent 70%),
  linear-gradient(#06060a,#08080c)}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
.prog{position:fixed;left:0;top:0;width:100%;height:2px;z-index:55;pointer-events:none;background:linear-gradient(90deg,var(--red2),var(--red));transform-origin:left;transform:scaleX(0)}

/* ---------- 顶栏（sticky：不受移动端浏览器地址栏伸缩影响） ---------- */
.top{position:sticky;top:0;z-index:50;height:var(--hh);margin-bottom:calc(var(--hh)*-1);padding:0 max(16px,calc((100% - 1240px)/2));display:flex;align-items:center;justify-content:space-between}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,6,10,.8),transparent);transition:opacity .35s}
/* 玻璃层单独放在伪元素里，靠 opacity 淡入淡出：不在滚动时切换 backdrop-filter，按钮不会跟着重绘闪烁 */
.top::after{content:"";position:absolute;inset:0;z-index:-1;box-sizing:border-box;pointer-events:none;opacity:0;transition:opacity .35s ease;background:rgba(8,8,12,.82);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.top.sc::before{opacity:0}
.top.sc::after{opacity:1}
/* 液态玻璃边缘折射（仅 Chromium 内核；其余浏览器保持上面的普通毛玻璃） */
.top.lg::after{background:rgba(8,8,12,.66);-webkit-backdrop-filter:url(#wys-lg) blur(9px) saturate(1.5) brightness(1.06);backdrop-filter:url(#wys-lg) blur(9px) saturate(1.5) brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(255,255,255,.16),inset 0 -8px 14px -10px rgba(255,255,255,.22),inset 0 8px 14px -12px rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:54px;height:30px;flex:none}
.mark svg{width:100%;height:100%;display:block}
.bname{display:flex;flex-direction:column;line-height:1}
.bname b{font-size:20px;font-weight:900;font-style:italic;letter-spacing:.05em}
.bname em{font:600 8.5px var(--en);font-style:normal;letter-spacing:.38em;color:var(--mut);margin-top:5px}
.tr{display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--silver);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;transition:transform .3s var(--ease),background .25s}
.ib:active{transform:scale(.9)}
.login-btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--red);color:#fff;border-radius:12px;transition:transform .3s var(--ease),filter .25s}
.login-btn:active{transform:scale(.92)}
.login-btn.in{padding:0;width:40px;justify-content:center;background:linear-gradient(135deg,#2a2a34,#15151c);border:1px solid var(--line2);color:var(--gold);font:800 16px var(--en)}

/* ---------- 视图 ---------- */
.view{display:none;padding-bottom:calc(120px + var(--safeB));overflow-x:clip}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.97)}}
@keyframes kin{from{opacity:0;transform:skewX(-14deg) translateX(-34px)}}
@keyframes subin{from{opacity:0;transform:skewX(-14deg) translateX(-46px)}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(22px,-16px,0)}}
@keyframes breathe{from{transform:scale(.92);opacity:.7}to{transform:scale(1.08);opacity:1}}
@keyframes wdrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-60px,0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{opacity:1;transform:translateX(0) skewX(-20deg)}to{opacity:1;transform:translateX(1500%) skewX(-20deg)}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes dfloat{to{transform:rotate(45deg) translate3d(16px,-16px,0)}}

/* 入场：用 animation + backwards，结束后不残留 transform，hover/tilt 才能正常工作 */
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .85s var(--ease) calc(var(--i,0)*70ms) backwards}

/* 文字逐字遮罩 */
.spl{overflow:visible}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.06em .08em .14em;margin:-.06em -.08em -.14em}
.sp{display:inline-block;width:.3em}
.c{display:inline-block;transform:translateY(115%) skewY(9deg);transform-origin:left bottom;transition:transform 1s var(--ease) calc(var(--i,0)*42ms + var(--d,0ms))}
.spl.in .c,.sl.on .spl .c{transform:none}
.sl:not(.on) .spl .c{transition:none}

/* 通用小组件 */
.slashes{display:inline-flex;gap:4px}
.slashes i{width:11px;height:6px;background:var(--red);transform:skewX(-32deg)}
.kick{display:inline-flex;align-items:stretch;height:28px;font:700 11px var(--en);letter-spacing:.2em;transform:skewX(-14deg);margin-left:6px;opacity:0}
.kick i{display:block;font-style:normal;transform:skewX(14deg);white-space:nowrap}
.kick b,.kick span{display:flex;align-items:center;padding:0 14px}
.kick b{background:rgba(255,255,255,.07);border:1px solid var(--line2);border-right:0;color:var(--silver);font-weight:700}
.kick span{background:var(--red);color:#fff}
.kick.in,.sl.on .kick{opacity:1;animation:kin .8s var(--ease) .1s backwards}
.sub{display:inline-block;margin-top:16px;margin-left:6px;opacity:0;transform:skewX(-14deg);background:#efe9e1;color:#16161c;border-left:5px solid var(--red)}
.sub i{display:block;font-style:normal;font-weight:800;font-size:15px;padding:9px 20px 9px 14px;transform:skewX(14deg)}
.sub.in{opacity:1;animation:subin .85s var(--ease) .35s backwards}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 30px;font-size:14px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--red);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .35s var(--ease),filter .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%)}
.btn:hover::after{transform:translateX(130%);transition:transform .8s var(--ease)}
.btn:active{transform:scale(.95)}
.btn.pressing{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.12)}
.btn.wide{width:100%}
.btn.load{pointer-events:none;filter:saturate(.5) brightness(.9)}
.btn.load span::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
.more{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--mut);padding:6px 0;transition:color .2s,gap .3s var(--ease);white-space:nowrap}
.more:hover{color:var(--red);gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 20px;font-size:13px;font-weight:700;color:var(--mut);background:var(--panel2);border:1px solid var(--line);transform:skewX(-12deg);transition:color .25s,background .25s,border-color .25s,transform .35s var(--ease)}
.chip:active{transform:skewX(-12deg) scale(.94)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.roledesc{font-size:13px;color:var(--mut);margin:0 0 20px 4px;min-height:20px}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:2px 16px 8px;margin-inline:-16px;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}
.hidden{display:none!important}

/* 编号标题（01 + 英文小字 + 中文标题） */
.sec{margin-top:clamp(52px,8vw,92px)}
.shead{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px}
.pnum{flex:none;display:grid;place-items:center;width:52px;height:38px;background:var(--red);transform:skewX(-14deg);margin-left:4px}
.pnum i{font:italic 800 22px var(--en);transform:skewX(14deg)}
.shead small{display:block;font:600 10.5px var(--en);letter-spacing:.34em;color:var(--mut);margin-bottom:2px}
.shead h2{font-size:clamp(24px,4vw,34px);font-weight:900;font-style:italic;line-height:1.15}

/* 数字统计 */
.nums{display:grid;grid-template-columns:repeat(var(--n,3),auto);gap:clamp(22px,6vw,58px);justify-content:start;margin-top:28px}
.nums.eq{grid-template-columns:repeat(var(--n),1fr);gap:8px;justify-content:stretch;margin-top:0}
.nm{position:relative;padding-top:14px;opacity:0}
.nm::before{content:"";position:absolute;left:0;top:0;width:26px;height:3px;background:var(--red);transform:skewX(-30deg)}
.nm b{display:block;font:italic 800 clamp(34px,9vw,54px)/1 var(--en);font-variant-numeric:tabular-nums}
.nm small{display:block;margin-top:8px;font:600 10px var(--en);letter-spacing:.26em;color:var(--mut)}
.nm span{display:block;font-size:12px;font-weight:700;color:#d5d5de;margin-top:2px}
.nums.in .nm{opacity:1;animation:rise .85s var(--ease) calc(var(--i,0)*90ms + 250ms) backwards}
.statbar{padding:30px 0 4px}

/* ---------- 跑马灯（速度随滚动加速、随速度倾斜） ---------- */
.mq{position:relative;overflow:hidden;white-space:nowrap;user-select:none;-webkit-user-select:none}
.mq-t{display:flex;width:max-content;will-change:transform}
.mq-g{display:flex;flex:none;align-items:center}
.mi{display:inline-flex;align-items:center;gap:10px;font-style:italic}
.mi em{font:700 italic .86em var(--en);letter-spacing:.14em;opacity:.8}
.sep{display:inline-block;flex:none;width:7px;height:.9em;background:currentColor;transform:skewX(-22deg);margin:0 .9em 0 1.2em;box-shadow:12px 0 0 currentColor}
.mq-red{background:var(--red);color:#fff;height:46px;font-weight:900;font-size:16px;letter-spacing:.08em}
.mq-red .mq-g{height:46px}
.mq-out{font:900 italic clamp(64px,14vw,168px)/1.05 var(--en);letter-spacing:.02em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.2)}
.mq-out .sep{background:var(--red);width:10px;box-shadow:16px 0 0 var(--red);height:.55em;-webkit-text-stroke:0}
.mq-out .mi em{-webkit-text-stroke:0}
.mq-wrap{margin-top:clamp(36px,6vw,64px);padding:0}

/* ---------- 首页 Hero ---------- */
.hero{position:relative;height:clamp(560px,88svh,740px);overflow:hidden;isolation:isolate;touch-action:pan-y;background:#050507}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility 0s .8s}
.sl.on{opacity:1;visibility:visible;transition:opacity .8s var(--ease)}
.art{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(70% 90% at 90% 20%,rgba(255,59,82,.2),transparent 65%),
  linear-gradient(120deg,#050507 25%,#12060a)}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 72px);-webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 80%);mask-image:linear-gradient(90deg,transparent 15%,#000 80%)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,6,10,.92) 0,rgba(6,6,10,.5) 42%,transparent 75%),linear-gradient(0deg,var(--bg) 0,transparent 34%)}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.6}
.lay{position:absolute;inset:0;will-change:transform;pointer-events:none}
.glow{position:absolute;right:-12%;top:-12%;width:85%;height:125%;background:radial-gradient(closest-side,rgba(255,59,82,.42),transparent);animation:breathe 6s ease-in-out infinite alternate}
.sh{position:absolute;animation:drift 8s ease-in-out infinite alternate}
.sh.b{animation-duration:11s;animation-direction:alternate-reverse}
.sh.c{animation-duration:9s}
.sweep{position:absolute;z-index:2;top:-20%;bottom:-20%;left:-80%;width:16%;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg);pointer-events:none}
.sl.on .sweep{animation:sweep 1.5s var(--ease) .15s}
/* 第 1 屏：双箭头 */
.s1 .sh.a{right:-3%;top:9%;width:46%;height:76%;background:linear-gradient(135deg,rgba(255,59,82,.6),rgba(120,10,30,.12) 72%);clip-path:polygon(0 0,62% 0,100% 50%,62% 100%,0 100%,38% 50%)}
.s1 .sh.b{right:22%;top:22%;width:30%;height:54%;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02));clip-path:polygon(0 0,62% 0,100% 50%,62% 100%,0 100%,38% 50%)}
.s1 .sh.c{right:2%;top:-8%;width:22%;height:42%;background:linear-gradient(160deg,rgba(255,59,82,.38),transparent);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
/* 第 2 屏：环形雷达 */
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.16)}
.s2 .ring.r1{right:-8%;top:50%;width:min(78vmin,640px);height:min(78vmin,640px);margin-top:calc(min(78vmin,640px)/-2);border-style:dashed;animation:spin 70s linear infinite}
.s2 .ring.r2{right:4%;top:50%;width:min(46vmin,380px);height:min(46vmin,380px);margin-top:calc(min(46vmin,380px)/-2);border-color:rgba(255,59,82,.55);animation:spin 40s linear infinite reverse}
.s2 .sh.a{right:10%;top:-6%;width:16%;height:120%;background:linear-gradient(180deg,rgba(255,59,82,.5),transparent 85%);clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}
.s2 .sh.d{right:28%;top:-6%;width:7%;height:120%;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 80%);clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}
/* 第 3 屏：菱形矩阵 */
.dia{position:absolute;border:1px solid rgba(255,255,255,.2);transform:rotate(45deg);animation:dfloat 9s ease-in-out infinite alternate}
.s3 .dia.d1{right:8%;top:16%;width:min(34vmin,300px);height:min(34vmin,300px);background:linear-gradient(135deg,rgba(255,59,82,.45),rgba(255,59,82,.04))}
.s3 .dia.d2{right:24%;top:46%;width:min(22vmin,190px);height:min(22vmin,190px);animation-duration:12s}
.s3 .dia.d3{right:2%;top:58%;width:min(16vmin,140px);height:min(16vmin,140px);background:rgba(255,255,255,.07);animation-duration:7s}
.s3 .sh.a{right:36%;top:-10%;width:12%;height:120%;background:linear-gradient(180deg,rgba(255,59,82,.34),transparent 80%);clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}
.hero-out{position:absolute;left:0;right:0;bottom:84px;z-index:1;opacity:.38;pointer-events:none}
.sl-c{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:var(--hh);padding-bottom:70px}
.hl{font-size:clamp(46px,8.6vw,108px);line-height:1.08;font-weight:900;font-style:italic;margin:18px 0 16px;letter-spacing:.01em}
.hl em{font-style:italic;color:var(--red)}
.lead2,.acts{opacity:0}
.sl.on .lead2{opacity:1;animation:rise .9s var(--ease) .55s backwards}
.sl.on .acts{opacity:1;animation:rise .9s var(--ease) .7s backwards}
.lead2{max-width:470px;color:#c6c6d0;font-size:15px;margin-bottom:26px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.hctl{position:absolute;left:0;right:0;bottom:30px;z-index:6;display:flex;align-items:center;gap:20px}
.ind{display:flex;gap:8px}
.bar{width:46px;height:20px;display:flex;align-items:center}
.bar b{display:block;width:100%;height:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transform-origin:left;transform:scaleX(0)}
.bar.done i{transform:scaleX(1)}
.bar.on i{animation:fill 6.5s linear forwards}
.hero.hold .bar.on i{animation-play-state:paused}
.cnt{font:700 12px var(--en);letter-spacing:.2em;color:var(--mut)}
.cnt b{color:#fff;font-size:15px}
.hnav{margin-left:auto;display:none;gap:8px}
.hnav button{width:44px;height:44px;display:grid;place-items:center;font-size:18px;background:rgba(10,10,14,.6);border:1px solid var(--line2);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:background .25s}
.hnav button:hover{background:var(--red)}
.hnav button:first-child svg{transform:scaleX(-1)}
@media(hover:hover) and (min-width:900px){.hnav{display:flex}}
.cr{position:absolute;width:18px;height:18px;opacity:.45;pointer-events:none;background:linear-gradient(#fff,#fff) center/1px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 1px no-repeat}
.cr.tl{left:max(16px,calc((100% - 1240px)/2));top:calc(var(--hh) + 14px)}
.cr.br{right:max(16px,calc((100% - 1240px)/2));bottom:18px}

/* ---------- 子页面头图（纯 CSS，不再使用横幅图片） ---------- */
.ph{position:relative;padding:calc(var(--hh) + 30px) 0 34px;overflow:hidden;isolation:isolate}
.ph-bg{position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,#050507 30%,#12060a)}
.ph-bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 72px);-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 85%);mask-image:linear-gradient(90deg,transparent 20%,#000 85%)}
.ph-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 50%)}
.lay2{position:absolute;inset:0}
.ph-bg .glow{right:-20%;top:-40%;width:90%}
.ph-bg .sh.a{right:-2%;top:-10%;width:34%;height:120%;background:linear-gradient(160deg,rgba(255,59,82,.5),rgba(255,59,82,.04) 80%);clip-path:polygon(34% 0,100% 0,66% 100%,0 100%)}
.ph-bg .sh.b{right:26%;top:-10%;width:12%;height:120%;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 85%);clip-path:polygon(34% 0,100% 0,66% 100%,0 100%)}
.word{position:absolute;right:-2%;bottom:-.16em;font:900 italic clamp(90px,24vw,280px)/1 var(--en);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.08);white-space:nowrap;animation:wdrift 18s ease-in-out infinite alternate;pointer-events:none}
.ph h1{font-size:clamp(42px,9.5vw,88px);font-weight:900;font-style:italic;line-height:1.1;margin:18px 0 0 4px;letter-spacing:.01em}
.ph-in{position:relative}

/* ---------- Bento 入口 ---------- */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:clamp(36px,6vw,64px)}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:156px;padding:18px;overflow:hidden;background:linear-gradient(160deg,#1b1b24,#0d0d12);clip-path:var(--cut);box-shadow:inset 0 0 0 1px var(--line)}
.tile.big{grid-column:span 2;min-height:210px}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--red),var(--red2));transform:translateX(-135%) skewX(-14deg);transition:transform .65s var(--ease)}
.tile>b,.tile>em,.tile>.tile-ic{position:relative;z-index:1}
.tile-ic{width:42px;height:42px;display:grid;place-items:center;font-size:22px;color:var(--red);background:rgba(255,59,82,.1);border-radius:10px;margin-bottom:14px;transition:background .4s,color .4s}
.tile b{display:block;font-size:19px;font-weight:900;font-style:italic}
.tile em{font-style:normal;font-size:12px;color:var(--mut);transition:color .4s;padding-right:34px}
.tile-w{position:absolute;z-index:1;right:12px;top:2px;font:900 italic 58px var(--en);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.1)}
.tile.big .tile-w{font-size:clamp(70px,16vw,130px);top:6px}
.tile-go{position:absolute;z-index:1;right:16px;bottom:16px;font-size:20px;transition:transform .5s var(--ease)}
.tile:active::before{transform:translateX(0) skewX(-14deg)}
.tile:active em{color:#fff}
.tile.pressing::before{transform:translateX(0) skewX(-14deg)}
.tile.pressing em{color:#fff}
.tile.pressing .tile-ic{background:#fff;color:var(--red)}
@media(hover:hover){.tile:hover::before{transform:translateX(0) skewX(-14deg)}.tile:hover .tile-ic{background:#fff;color:var(--red)}.tile:hover em{color:#fff}.tile:hover .tile-go{transform:translateX(6px)}}
@media(min-width:900px){.bento{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(156px,auto)}.tile.big{grid-column:span 2;grid-row:span 2;min-height:0}}
.uts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:900px){.uts{grid-template-columns:repeat(6,1fr)}}
.ut{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px;background:var(--panel);border:1px solid var(--line);clip-path:var(--cut)}
.ut svg{font-size:26px;color:var(--gold)}
.ut b{font-size:14px}
.ut small{font:600 9.5px var(--en);letter-spacing:.2em;color:var(--mut)}
.gic{display:grid;place-items:center;width:64px;height:64px;margin:0 auto;font-size:30px;color:var(--red);background:rgba(255,59,82,.1);transform:skewX(-12deg)}
.gic svg{transform:skewX(12deg)}
.foot .fw{font:800 italic 15px var(--en);letter-spacing:.1em;color:var(--mut)}

/* ---------- 倾斜（桌面 hover） ---------- */
.tilt{transform:perspective(900px) translate3d(0,var(--ty,0px),0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .6s var(--ease),border-color .3s}
.tilt.hv{transition:transform .12s linear,border-color .3s}
@media(hover:hover){.tilt:hover{--ty:-5px}}
.tilt:active{--sc:.97}

/* ---------- 转场幕布 ---------- */
.curtain{position:fixed;inset:0;z-index:90;pointer-events:none;visibility:hidden;overflow:hidden}
.curtain i{position:absolute;top:-4%;bottom:-4%;left:-15%;width:130%;transform:translateX(-125%) skewX(-14deg)}
.curtain .c1{background:var(--red)}
.curtain .c2{background:#09090d}

.bento .tile:last-child{grid-column:span 2}
@media(max-width:720px){
  .hero{height:clamp(560px,92svh,700px)}
  .sl-c{justify-content:flex-end;padding-bottom:96px}
  .art::after{background:linear-gradient(0deg,rgba(6,6,10,.96) 0,rgba(6,6,10,.6) 45%,transparent 80%),linear-gradient(0deg,var(--bg) 0,transparent 18%)}
  .s1 .sh.a{right:-34%;top:3%;width:96%;height:52%}
  .s1 .sh.b{right:14%;top:14%;width:56%;height:34%}
  .s1 .sh.c{right:-6%;top:-10%;width:40%;height:30%}
  .s2 .ring.r1{right:-40%;top:30%}
  .s2 .ring.r2{right:-6%;top:30%}
  .s3 .dia.d1{right:-4%;top:6%}.s3 .dia.d2{right:34%;top:28%}.s3 .dia.d3{right:-4%;top:34%}
  .hero-out{bottom:auto;top:calc(var(--hh) + 20px)}
  .g-map,.g-art,.g-it{grid-template-columns:1fr}
  .g-ag{grid-template-columns:repeat(2,1fr)}
  .cr.tl{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv,.kick,.sub,.nm,.lead2,.acts{opacity:1}
  .c{transform:none}
}
@supports not (backdrop-filter:blur(1px)){.dock{background:rgba(24,24,32,.96)}.top::after{background:rgba(8,8,12,.97)}}
.me-c{margin-bottom:40px}


/* ---------- 图标尺寸统一：小 15 / 中 18 / 大 20-22 ---------- */
.login-btn svg{font-size:18px}
.btn svg{font-size:18px}
.more svg{font-size:16px}
.fav svg{font-size:18px}
.meta svg,.done-tag svg{font-size:15px}
.menu svg{font-size:20px}
.x svg,.hnav svg{font-size:20px}
.login-btn{gap:6px}

/* ---------- 卡片 ---------- */
.card{position:relative;display:block;width:100%;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:transform .45s var(--ease),border-color .3s}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:0 0 0 1px var(--red),0 14px 40px rgba(255,59,82,.18);opacity:0;transition:opacity .3s}
@media(hover:hover){.card:hover{transform:translateY(-5px)}.card:hover::after{opacity:1}}
.card:active{transform:scale(.98)}
.grid{display:grid;gap:14px}
.g-art{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g-map{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g-ag{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g-it{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* 特工卡 */
.ag{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);background:linear-gradient(170deg,color-mix(in srgb,var(--c) 24%,#0d0d12),#09090d 72%);transition:transform .45s var(--ease),border-color .3s}
.hs .ag{width:148px}
.ag::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,color-mix(in srgb,var(--c) 20%,transparent) 38.3%,transparent 64%)}
.ag-l{position:absolute;right:-8%;top:-2%;font:900 170px/1 var(--en);font-style:italic;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.ag-r{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;font-size:11px;font-weight:700;color:var(--c);background:rgba(0,0,0,.5);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ag-n{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(0deg,rgba(6,6,10,.95),transparent)}
.ag-n b{display:block;font-size:19px;font-weight:900;font-style:italic}
.ag-n em{font:600 10px var(--en);font-style:normal;letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
@media(hover:hover){.ag:hover{transform:translateY(-5px);border-color:var(--c)}}
.ag:active{transform:scale(.97)}

/* 地图卡 */
.mp{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,hsl(var(--h) 62% 22%),#08080c 72%);transition:transform .45s var(--ease),border-color .3s}
.mp-ph{position:absolute;inset:0;background-size:cover;background-position:center}
.mp::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 52%,hsl(var(--h) 80% 55%/.2) 52.3%,transparent 78%),radial-gradient(60% 80% at 100% 100%,hsl(var(--h) 90% 50%/.3),transparent 70%)}
.mp-g{position:absolute;left:12px;top:6px;font:900 54px/1 var(--en);font-style:italic;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.16);text-transform:uppercase;white-space:nowrap}
.mp-t{position:absolute;right:12px;top:12px;height:24px;padding:0 10px;display:flex;align-items:center;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);border:1px solid var(--line2)}
.mp-i{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(0deg,rgba(6,6,10,.96),transparent)}
.mp-i b{font-size:21px;font-weight:900;font-style:italic}
.mp-i em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
@media(hover:hover){.mp:hover{transform:translateY(-5px);border-color:hsl(var(--h) 80% 55%)}}
.mp:active{transform:scale(.98)}

/* 文章卡 */
.ar{text-align:left}
.ar-c{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 60% 20%),#09090d 75%)}
.ar-c::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 55%,hsl(var(--h) 85% 55%/.22) 55.3%,transparent 80%)}
.ar-c span{position:absolute;right:12px;bottom:-14px;font:900 84px/1 var(--en);font-style:italic;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.14)}
.ar-c em{position:absolute;left:12px;top:12px;height:22px;padding:0 9px;display:flex;align-items:center;font-size:11px;font-weight:700;font-style:normal;background:var(--red)}
.ar-b{padding:14px 16px 16px}
.ar-b h3{font-size:16px;font-weight:800;line-height:1.4;margin-bottom:8px}
.ar-b p{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:12px;color:var(--dim)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.done-tag{color:#4fe3c1!important}

/* 道具卡 */
.it{padding:18px;text-align:left}
.it-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.it-ic{width:44px;height:44px;display:grid;place-items:center;font-size:22px;color:var(--gold);background:rgba(232,198,128,.08);border:1px solid rgba(232,198,128,.25);clip-path:var(--cut)}
.it-h b{display:block;font-size:17px;font-weight:800}
.it-h em{font:600 10px var(--en);font-style:normal;letter-spacing:.28em;color:var(--mut);text-transform:uppercase}
.it p{font-size:13px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:11px;padding:3px 9px;color:var(--silver);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.panel{display:none}
.panel.on{display:block;animation:vin .45s var(--ease)}
.eco{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.eco .it-ic{color:var(--red);background:rgba(255,59,82,.1);border-color:rgba(255,59,82,.3)}

/* 学习路线 */
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:34px}
.step{position:relative;padding:18px;background:var(--panel);border:1px solid var(--line);clip-path:var(--cut)}
.step i{font:900 34px var(--en);font-style:italic;color:var(--red)}
.step b{display:block;font-size:15px;margin:4px 0}
.step p{font-size:12px;color:var(--mut)}
.step u{display:block;height:3px;margin-top:12px;background:rgba(255,255,255,.1);text-decoration:none}
.step u s{display:block;height:100%;background:var(--red);text-decoration:none;transform-origin:left;transition:transform .8s var(--ease)}
@media(max-width:720px){.path{grid-template-columns:1fr}}

/* CTA 条 & 页脚 */
.cta{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px;overflow:hidden;background:linear-gradient(100deg,#1a0a0e,#0e0e13 60%);clip-path:var(--cut);box-shadow:inset 0 0 0 1px rgba(255,59,82,.3)}
.cta h3{font-size:20px;font-weight:900;font-style:italic}
.cta p{font-size:13px;color:var(--mut);margin-top:2px}
.is-in .cta-login{display:none}
@media(max-width:640px){.cta{flex-direction:column;align-items:flex-start}}
.foot{margin-top:60px;padding:28px 0 0;border-top:1px solid var(--line);color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.foot .bname b{color:var(--txt)}
.foot p{max-width:640px}

/* ---------- Dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(14px + var(--safeB));transform:translateX(-50%);z-index:60;display:flex;gap:2px;padding:7px;border-radius:28px;
  background:rgba(24,24,32,.7);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.dock a{position:relative;z-index:1;width:clamp(46px,13.6vw,64px);height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:#9a9aa8;transition:color .3s,transform .4s var(--ease)}
.dock a svg{font-size:22px;transition:transform .45s var(--ease),color .3s}
.dock a.on{color:#fff}
.dock a.on svg{color:var(--red);transform:translateY(-1px) scale(1.1)}
.dock a:active{transform:scale(.9)}
.lens{position:absolute;left:7px;top:7px;height:54px;width:56px;border-radius:21px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(255,255,255,.08);
  will-change:transform}
.lens.mv{transition:transform .55s cubic-bezier(.3,1.25,.5,1),width .3s}
@media(min-width:900px){.dock a{height:58px;font-size:11.5px}.lens{height:58px}}

/* ---------- 弹层 ---------- */
.ov{position:fixed;inset:0;z-index:100;visibility:hidden;pointer-events:none;transition:visibility 0s .4s}
.ov.on{visibility:visible;pointer-events:auto;transition:none}
.ov-bg{position:absolute;inset:0;background:rgba(0,0,0,.66);opacity:0;transition:opacity .4s var(--ease)}
.ov.on .ov-bg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#14141b,#0c0c11);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s var(--ease);outline:0}
.ov.on .sheet{transform:none}
.sheet::before{content:"";width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:10px auto 0;flex:none}
.x{position:absolute;right:12px;top:12px;z-index:3;width:36px;height:36px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.08);border-radius:50%}
.sb{overflow:auto;overscroll-behavior:contain;padding:8px 20px calc(28px + var(--safeB))}
@media(min-width:820px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,92vw);max-height:86dvh;border:1px solid var(--line2);border-radius:20px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .5s var(--ease),opacity .35s}
  .ov.on .sheet{transform:translate(-50%,-50%);opacity:1}
  .sheet::before{display:none}
  .sheet.auth{width:min(430px,92vw)}
  .sb{padding:26px 26px 28px}
}
.sh-hero{position:relative;display:flex;align-items:flex-end;min-height:150px;padding:18px;margin:10px 0 18px;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,#0d0d12),#0a0a0e 75%);border:1px solid var(--line)}
.sh-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 50%,color-mix(in srgb,var(--c) 22%,transparent) 50.3%,transparent 76%)}
.sh-l{position:absolute;right:6px;top:-18px;font:900 150px/1 var(--en);font-style:italic;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.sh-hero>div{position:relative}
.tagx{display:inline-block;height:22px;line-height:22px;padding:0 10px;font-size:11px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:rgba(0,0,0,.4)}
.sh-hero h3{font-size:30px;font-weight:900;font-style:italic;line-height:1.2;margin-top:8px}
.sh-hero em{font:600 10px var(--en);font-style:normal;letter-spacing:.34em;color:var(--mut);text-transform:uppercase}
.sh-sec{margin-bottom:20px}
.sh-sec h4{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:10px;letter-spacing:.06em}
.sh-sec h4::before{content:"";width:3px;height:14px;background:var(--red);transform:skewX(-20deg)}
.sh-sec p{font-size:14px;color:#c4c4ce}
.lead{font-size:15px!important}
.skl{display:grid;gap:10px}
.skl li{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.skl kbd{flex:none;width:30px;height:30px;display:grid;place-items:center;font:800 14px var(--en);background:var(--red);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.skl b{font-size:14px}
.skl small{font-size:11px;color:var(--gold);margin-left:4px;font-weight:600}
.skl p{font-size:13px;margin-top:2px}
.pts li{position:relative;padding:8px 0 8px 18px;font-size:14px;color:#c4c4ce;border-bottom:1px dashed var(--line)}
.pts li::before{content:"";position:absolute;left:2px;top:16px;width:7px;height:4px;background:var(--red);transform:skewX(-30deg)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel button{height:32px;padding:0 14px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.rel button:hover{border-color:var(--red)}
.acts2{display:flex;gap:10px;margin-top:6px}
.fav{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1;height:46px;font-size:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line2);transition:background .25s,border-color .25s,transform .25s var(--ease)}
.fav:active{transform:scale(.96)}
.fav.on{border-color:var(--red);color:var(--red);background:rgba(255,59,82,.1)}
.fav.on svg{fill:currentColor}
.fav.ok.on{color:#4fe3c1;border-color:#4fe3c1;background:rgba(79,227,193,.1)}

/* 登录表单 */
.auth-h{text-align:center;padding:6px 0 16px}
.auth-h p{font-size:13px;color:var(--mut);margin-top:6px}
.logo-full{position:relative;width:132px;min-height:96px;margin:0 auto;display:grid;place-items:center}
.logo-full img{width:100%;height:auto;display:block;mix-blend-mode:lighten}
.logo-full.ok .lfb{display:none}
.lfb{text-align:center}
.guestlogo{width:150px;min-height:0;height:100px}.guestlogo svg{width:100%;height:100%}
.lfb svg{width:104px;height:57px}
.lfb b{display:block;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.06em;margin-top:4px}
.lfb em{display:block;margin-top:4px;font:600 8.5px var(--en);font-style:normal;letter-spacing:.4em;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px}
.seg button{height:38px;text-align:center;font-size:14px;font-weight:700;color:var(--mut);border-radius:9px;transition:background .3s var(--ease),color .3s}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.form{display:grid;gap:12px}
.fld{position:relative;display:flex;align-items:center}
.fld .fi{position:absolute;left:14px;font-size:18px;color:var(--dim);pointer-events:none}
.fld input{width:100%;height:50px;padding:0 44px 0 44px;background:#0a0a0f;border:1px solid var(--line2);border-radius:12px;outline:0;font-size:15px;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,82,.15)}
.fld input.bad{border-color:var(--red)}
.fld input::placeholder{color:var(--dim)}
.eye{position:absolute;right:6px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--dim)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer;line-height:1.4}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck i{flex:none;width:18px;height:18px;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck input:checked+i{background:var(--red);border-color:var(--red)}
.ck input:checked+i::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lnk{color:var(--red);font-size:13px;flex:none}
.ferr{min-height:18px;font-size:12.5px;color:var(--red)}
.oauth{margin-top:20px;text-align:center;font-size:12px;color:var(--dim)}
.oauth span{display:flex;align-items:center;gap:12px}
.oauth span::before,.oauth span::after{content:"";flex:1;height:1px;background:var(--line)}
.oauth div{display:flex;gap:10px;margin-top:14px}
.oauth button{flex:1;height:44px;text-align:center;font-size:14px;font-weight:600;color:var(--silver);background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px}

/* 搜索 */
.sbox{position:relative;margin:10px 0 14px}
.sbox input{width:100%;height:50px;padding:0 16px 0 46px;background:#0a0a0f;border:1px solid var(--line2);border-radius:12px;outline:0;font-size:15px}
.sbox input:focus{border-color:var(--red)}
.sbox svg{position:absolute;left:15px;top:15px;font-size:20px;color:var(--dim)}
.sres{display:grid;gap:8px;min-height:200px}
.sres button{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sres b{font-size:14px}
.sres small{margin-left:auto;font-size:11px;color:var(--gold)}
.sres p{padding:30px 0;text-align:center;color:var(--dim);font-size:13px}

/* 我的 */
.me-c{display:flex;align-items:center;gap:16px;padding:22px;margin-bottom:16px;background:linear-gradient(120deg,#1c0b10,#101016 65%);clip-path:var(--cut);box-shadow:inset 0 0 0 1px rgba(255,59,82,.28)}
.av{flex:none;width:64px;height:64px;display:grid;place-items:center;font:900 28px var(--en);font-style:italic;color:var(--gold);background:linear-gradient(135deg,#2c2c37,#14141a);border:1px solid var(--line2);clip-path:var(--cut)}
.av img,.login-btn.in img{width:100%;height:100%;object-fit:cover;display:block}
.login-btn.in{overflow:hidden}
.me-c h3{font-size:20px;font-weight:900}
.me-c p{font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stats div{padding:16px 10px;text-align:center;background:var(--panel);border:1px solid var(--line)}
.stats b{display:block;font:900 26px var(--en);font-style:italic;color:var(--red)}
.stats span{font-size:12px;color:var(--mut)}
.menu{display:grid;gap:8px;margin-top:22px}
.menu button{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;font-size:14px;font-weight:600;background:var(--panel);border:1px solid var(--line)}
.menu svg:last-child{margin-left:auto;color:var(--dim)}
.empty{padding:36px 0;text-align:center;color:var(--dim);font-size:13px}
.guest{padding:44px 20px;text-align:center;background:var(--panel);border:1px solid var(--line);clip-path:var(--cut)}
.guest h3{font-size:20px;font-weight:900;font-style:italic;margin:14px 0 6px}
.guest p{font-size:13px;color:var(--mut);margin-bottom:22px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safeB));z-index:200;max-width:86vw;padding:11px 20px;font-size:13px;font-weight:600;background:rgba(30,30,40,.95);border:1px solid var(--line2);border-left:3px solid var(--red);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}


.auth-t{font-size:26px;font-weight:900;font-style:italic;margin-top:14px}
.auth-h .kick{margin-left:0}


/* ======================= v2 动效增强 ======================= */
/* 数字统计：上方细线 + 红色斜切线头，从左向右画出 */
.nm{padding-top:14px}
.nm::before{left:0;right:0;top:0;width:auto;height:1px;background:rgba(255,255,255,.16);transform:scaleX(0);transform-origin:left}
.nm::after{content:"";position:absolute;left:0;top:-1px;width:30px;height:3px;background:var(--red);transform:skewX(-30deg) scaleX(0);transform-origin:left}
.nums.in .nm::before{animation:ln 1.1s var(--ease) calc(var(--i,0)*90ms + 350ms) forwards}
.nums.in .nm::after{animation:ln2 .9s var(--ease) calc(var(--i,0)*90ms + 600ms) forwards}
@keyframes ln{to{transform:scaleX(1)}}
@keyframes ln2{to{transform:skewX(-30deg) scaleX(1)}}
.nm b.fin{animation:fin .7s var(--ease)}
@keyframes fin{0%{transform:scale(1)}35%{transform:scale(1.14) skewX(-5deg);text-shadow:0 0 26px rgba(255,59,82,.85);color:#fff}100%{transform:scale(1);text-shadow:0 0 0 transparent}}
.nm b{transform-origin:left bottom}

/* 编号标题：序号翻入 + 底部细线画出 */
.shead{position:relative}
.shead::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:1px;background:linear-gradient(90deg,var(--red),rgba(255,255,255,.14) 28%,transparent);transform:scaleX(0);transform-origin:left}
.shead.in::after{animation:ln 1.3s var(--ease) .25s forwards}
.shead.in .pnum{animation:pnum .9s var(--ease) .1s backwards}
@keyframes pnum{from{transform:skewX(-14deg) scaleX(0);transform-origin:left}to{transform:skewX(-14deg) scaleX(1);transform-origin:left}}

/* 页头：红光扫过 + 标题故障闪一下 */
.ph::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-45%;width:20%;opacity:0;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,59,82,.38),transparent);transform:translateX(-130%) skewX(-18deg);animation:phsweep 1.4s var(--ease) .35s forwards}
@keyframes phsweep{from{opacity:1}to{opacity:1;transform:translateX(900%) skewX(-18deg)}}
.ph h1.spl.in{animation:glt 1.1s steps(1) 1.15s backwards}
@keyframes glt{0%,100%{text-shadow:none}12%{text-shadow:4px 0 rgba(255,59,82,.9),-4px 0 rgba(90,220,255,.7)}24%{text-shadow:-5px 0 rgba(255,59,82,.9),5px 0 rgba(90,220,255,.7)}36%{text-shadow:none}58%{text-shadow:3px 0 rgba(255,59,82,.8),-3px 0 rgba(90,220,255,.6)}70%{text-shadow:none}}
.lay2{will-change:transform}

/* Bento：小卡片加高，水印与图标不再重叠 */
.tile{min-height:188px}.tile.big{min-height:220px}
.tile:not(.big) .tile-w{font-size:44px;top:8px}

/* 不同卡片不同入场方式 */
.mp.rv.in{animation:mpin .95s var(--ease) calc(var(--i,0)*80ms) backwards}
@keyframes mpin{from{opacity:0;transform:translateY(46px) skewY(3deg) scale(.94)}}
.ag.rv.in{animation:agin .9s var(--ease) calc(var(--i,0)*70ms) backwards}
@keyframes agin{from{opacity:0;transform:translateX(70px) skewX(-8deg)}}
.ut{position:relative;overflow:hidden}
.ut.rv.in{animation:utin .8s var(--ease) calc(var(--i,0)*55ms) backwards}
@keyframes utin{from{opacity:0;transform:scale(.55) rotate(-7deg)}}
.mp-ph{transform:scale(1.04);transition:transform 1.4s var(--ease)}
.mp.rv.in .mp-ph{animation:mpimg 1.6s var(--ease) calc(var(--i,0)*80ms + 100ms) backwards}
@keyframes mpimg{from{transform:scale(1.4)}}
.mp.hv .mp-ph,.mp:active .mp-ph{transform:scale(1.14)}
.tile-w{transition:transform .7s var(--ease),-webkit-text-stroke-color .4s}
.tile.hv .tile-w,.tile:active .tile-w{transform:translateX(-12px) skewX(-6deg);-webkit-text-stroke-color:rgba(255,255,255,.42)}
.tile.hv .tile-go,.tile:active .tile-go{transform:translateX(5px)}

/* 悬停高光 / 点击涟漪 / 鼠标光晕 */
.spot{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),rgba(255,59,82,.10) 42%,transparent 72%)}
.hv>.spot{opacity:1}
.rpl{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,59,82,.4) 45%,transparent 70%);animation:rpl .75s var(--ease) forwards}
@keyframes rpl{from{transform:translate3d(var(--x),var(--y),0) scale(1);opacity:.95}to{transform:translate3d(var(--x),var(--y),0) scale(28);opacity:0}}
.cglow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle,rgba(255,59,82,.14),transparent 62%);will-change:transform}
.cglow.on{opacity:1}

/* 顶栏 / dock 入场与图标弹跳 */
.brand,.top .ib,.login-btn{animation:topin .9s var(--ease) .1s backwards}
.top .ib{animation-delay:.2s}.login-btn{animation-delay:.3s}
@keyframes topin{from{opacity:0;transform:translateY(-18px)}}
.dock{animation:dockin 1.1s var(--ease) .2s backwards}
@keyframes dockin{from{opacity:0;transform:translateX(-50%) translateY(130%)}}
.dock a.on svg{animation:pop .7s var(--ease)}
@keyframes pop{0%{transform:translateY(0) scale(.65)}50%{transform:translateY(-6px) scale(1.28)}100%{transform:translateY(-1px) scale(1.1)}}

/* 开场：首次访问的黑屏开幕（每个会话一次） */
.intro{display:none;position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden}
.introing .intro{display:block;animation:ihide 0s linear 1.95s forwards}
@keyframes ihide{to{visibility:hidden}}
.intro .pn{position:absolute;left:0;right:0;height:50.6%;background:#050507}
.intro .pt{top:0;animation:ipt .85s cubic-bezier(.76,0,.24,1) 1.05s forwards}
.intro .pb{bottom:0;animation:ipb .85s cubic-bezier(.76,0,.24,1) 1.05s forwards}
@keyframes ipt{to{transform:translateY(-101%)}}
@keyframes ipb{to{transform:translateY(101%)}}
.intro-c{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:ifade .35s ease .95s forwards}
@keyframes ifade{to{opacity:0}}
.intro-w{font:900 italic clamp(44px,13vw,92px)/1.1 var(--en);letter-spacing:.02em;overflow:hidden;padding:.08em .1em}
.intro-w span{display:inline-block;transform:translateY(115%) skewY(9deg);animation:iup .9s var(--ease) forwards}
.intro-w span:nth-child(2){animation-delay:.07s}.intro-w span:nth-child(3){animation-delay:.14s}
@keyframes iup{to{transform:none}}
.intro-s{font:700 12px var(--en);letter-spacing:.5em;color:var(--mut);opacity:0;animation:isub .9s var(--ease) .35s forwards;padding-left:.5em}
@keyframes isub{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.5em}}
.intro-l{display:block;width:min(240px,56vw);height:3px;background:var(--red);transform:skewX(-30deg) scaleX(0);transform-origin:left;animation:ilin .9s var(--ease) .25s forwards}
@keyframes ilin{to{transform:skewX(-30deg) scaleX(1)}}
.introing .dock{animation-delay:1.5s}
.introing .brand,.introing .top .ib,.introing .login-btn{animation-delay:1.4s}
.introing .top .ib{animation-delay:1.5s}.introing .login-btn{animation-delay:1.6s}
@media(prefers-reduced-motion:reduce){.nm::before{transform:none}.nm::after{transform:skewX(-30deg)}.shead::after{transform:none}.ph::after{display:none}.intro{display:none!important}}

/* ===== v3：手游标识 / 切换更跟手 / 筛选滑块 ===== */
.bname b{display:inline-flex;align-items:center;gap:6px}
.mtag{font:800 10px/1 var(--en);font-style:normal;letter-spacing:.06em;padding:3px 6px 3px;color:#1a1306;background:linear-gradient(135deg,#f3dba0,#c9a24f);transform:skewX(-14deg);display:inline-block}
.intro-m{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.18em;opacity:0;animation:isub2 .8s var(--ease) .6s forwards}
@keyframes isub2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chips{position:relative;padding:2px 12px;margin-inline:-12px;margin-bottom:14px}
.chip{position:relative;z-index:1}
.chip.on{background:transparent;border-color:transparent}
.cpill{position:absolute;left:0;top:2px;height:38px;z-index:0;pointer-events:none;background:var(--red);box-shadow:0 6px 22px -6px rgba(255,59,82,.7);transform:translateX(var(--px,0px)) skewX(-12deg);width:var(--pw,0px);opacity:0}
.cpill.rdy{opacity:1}
.cpill.mv{transition:transform .5s cubic-bezier(.3,1.15,.5,1),width .4s var(--ease)}
.chip{transition:color .3s,transform .35s var(--ease)}
.grid.swap,.panel.swap{opacity:0;transform:translateY(10px);transition:opacity .14s ease,transform .14s ease}
.grid,.panel{transition:opacity .3s ease,transform .4s var(--ease)}
.lens.mv{transition:transform .42s cubic-bezier(.3,1.15,.5,1),width .3s}
.dock a.on svg{animation-duration:.5s}

/* ===== v4：跑马灯高低错落 / 点击特效 / 搜索栏变形 ===== */
/* 跑马灯：大小字高低错落，红带里英文变描边，大字带渐变实心词，两端渐隐 */
.mq-red{height:46px}.mq-red .mq-g{height:46px}
.mq-red .mi:nth-of-type(odd){font-size:18px;letter-spacing:.08em}
.mq-red .mi:nth-of-type(even){font-size:12px;letter-spacing:.28em;align-self:center}
.mq-red .mi:nth-of-type(even) em{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.92);opacity:1;font-size:1em;letter-spacing:.28em}
.mq-red .sep{width:5px;height:.95em;margin:0 1.3em 0 1.7em;box-shadow:8px 0 0 currentColor;opacity:.85}
.mq-out{line-height:1.08;padding:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.mq-out .mi{padding-right:.06em}
.mq-out .mi:nth-of-type(even){color:transparent;-webkit-text-stroke:0;background:linear-gradient(180deg,rgba(255,255,255,.96) 10%,rgba(255,255,255,.08) 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mq-out .mi:nth-of-type(odd){font-size:.62em;align-self:center;letter-spacing:.12em;-webkit-text-stroke:1.2px rgba(255,255,255,.3)}
.mq-out .sep{height:.5em;width:8px;box-shadow:13px 0 0 var(--red);margin:0 1.1em 0 .8em}

/* 点击空白处：红色光环 + 菱形闪点 + 斜线飞散 */
.tap{position:fixed;left:0;top:0;width:0;height:0;z-index:300;pointer-events:none}
.tap i{position:absolute;left:0;top:0;pointer-events:none;display:block}
.tap .r1{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1.5px solid rgba(255,59,82,.95);box-shadow:0 0 14px rgba(255,59,82,.5);animation:tr1 .75s cubic-bezier(.2,.8,.2,1) forwards}
.tap .r2{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1px solid rgba(255,255,255,.5);animation:tr1 .95s cubic-bezier(.2,.8,.2,1) .07s both}
.tap .d{width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;box-shadow:0 0 12px #fff,0 0 22px var(--red);animation:td .5s var(--ease) forwards}
.tap .s{width:16px;height:2px;margin-top:-1px;background:linear-gradient(90deg,var(--red),rgba(255,255,255,.9));border-radius:2px;animation:ts .65s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes tr1{from{transform:scale(.4);opacity:1}to{transform:scale(5.2);opacity:0}}
@keyframes td{from{transform:rotate(45deg) scale(1.2);opacity:1}to{transform:rotate(45deg) scale(0);opacity:0}}
@keyframes ts{from{opacity:1;transform:rotate(var(--a)) translateX(8px) scaleX(.3)}to{opacity:0;transform:rotate(var(--a)) translateX(36px) scaleX(1.5)}}

/* 搜索：顶栏本身变成搜索框，两侧元素左右滑出，输入框从按钮处横向生长 */
.brand,.login-btn,#searchBtn{transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .3s ease,filter .25s}
.srch .brand{transform:translateX(-56px);opacity:0;pointer-events:none}
.srch .login-btn{transform:translateX(56px);opacity:0;pointer-events:none;transition-delay:.04s}
.srch #searchBtn{opacity:0;pointer-events:none;transform:scale(.7);transition-duration:.25s}
.srch .top::before{opacity:0}.srch .top::after{opacity:1}
.sbar{position:absolute;left:max(16px,calc((100% - 1240px)/2));right:max(16px,calc((100% - 1240px)/2));top:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:8px;padding:0 5px 0 14px;overflow:hidden;
 border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--line2);opacity:0;pointer-events:none;
 clip-path:inset(0 var(--sr,0px) 0 var(--sl,calc(100% - 40px)) round 12px);
 transition:clip-path .6s cubic-bezier(.7,0,.2,1),opacity .15s ease .35s,box-shadow .5s,border-color .5s}
.srch .sbar{opacity:1;pointer-events:auto;clip-path:inset(0 0 0 0 round 12px);transition:clip-path .6s cubic-bezier(.7,0,.2,1),opacity .08s,box-shadow .5s .2s,border-color .5s .2s;border-color:rgba(255,59,82,.6);box-shadow:0 0 0 1px rgba(255,59,82,.25),0 10px 34px -10px rgba(255,59,82,.55)}
.sbar>*{opacity:0;transform:translateX(10px);transition:opacity .2s,transform .3s var(--ease)}
.srch .sbar>*{opacity:1;transform:none;transition:opacity .35s ease .3s,transform .5s var(--ease) .3s}
.sbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-110%)}
.srch .sbar::after{animation:sbsw 1s var(--ease) .35s forwards}
@keyframes sbsw{to{transform:translateX(110%)}}
.sbar-ic{display:grid;place-items:center;font-size:20px;color:var(--red);flex:none}
.sbar input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;font-size:16px;color:var(--txt);caret-color:var(--red)}
.sbar input::placeholder{color:var(--dim)}
.sbar input::-webkit-search-cancel-button{display:none}
.sbar-x{flex:none;width:26px;height:26px;display:none;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);color:var(--txt);font-size:14px}
.sbar.has .sbar-x{display:grid}
.sbar-c{flex:none;height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.1)}
.sbar-c:active,.sbar-x:active{transform:scale(.9)}
.spanel{position:fixed;left:0;right:0;top:var(--hh);bottom:0;z-index:49;background:rgba(6,6,10,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
 clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .55s cubic-bezier(.7,0,.2,1),visibility 0s .55s}
.srch .spanel{clip-path:inset(0);visibility:visible;transition:clip-path .6s cubic-bezier(.7,0,.2,1) .12s,visibility 0s}
.spi{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:22px 16px 60px;max-width:760px;margin:0 auto;-webkit-overflow-scrolling:touch}
.spi h6{font:700 11px var(--en);letter-spacing:.3em;color:var(--mut);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.spi h6::before{content:"";width:3px;height:12px;background:var(--red);transform:skewX(-20deg)}

async function socFetch(qs){

function decodeU(u){
  let b=String(u).replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');
  while(b.length%4)b+='=';
  const bin=atob(b);let pct='';
  for(let i=0;i<bin.length;i++)pct+='%'+('00'+bin.charCodeAt(i).toString(16)).slice(-2);
  return JSON.parse(decodeURIComponent(pct));
}

  bars.forEach((b,x)=>{b.addEventListener('click',()=>go(x));$('i',b).addEventListener('animationend',e=>{if(e.animationName==='fill')go(i+1)})});
  $$('[data-hero]',hero).forEach(b=>b.addEventListener('click',()=>go(i+ +b.dataset.hero)));
  hero.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hero.classList.add('hold')});
  hero.addEventListener('pointerleave',()=>{hero.classList.remove('hold');hp.tx=hp.ty=0});
  hero.addEventListener('pointerdown',e=>{sx=e.clientX;drag=true});
  hero.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const d=e.clientX-sx;if(Math.abs(d)>48)go(i+(d<0?1:-1))});
  hero.addEventListener('pointercancel',()=>drag=false);
  hero.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=hero.getBoundingClientRect();hp.tx=(e.clientX-r.left)/r.width-.5;hp.ty=(e.clientY-r.top)/r.height-.5},{passive:true});
  H={el:hero,vis:true,layers:$$('.lay',hero).map(l=>({l,d:+l.dataset.d,s:''}))};
  new IntersectionObserver(es=>{if(H&&H.el===hero)H.vis=es[0].isIntersecting}).observe(hero);
  requestAnimationFrame(()=>requestAnimationFrame(()=>go(0)));
}
document.addEventListener('visibilitychange',()=>{const h=$('#hero');if(h)h.classList.toggle('hold',document.hidden)});

function swapPanel(v,idx){
  const ps=$$('.panel',v),from=ps.find(p=>p.classList.contains('on')),to=ps.find(p=>p.dataset.p===idx);if(!to||from===to)return;
  if(RM||!from.animate){ps.forEach(p=>p.classList.toggle('on',p===to));return}
  const id=v._sw=(v._sw||0)+1;
  from.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(8px)'}],{duration:140,easing:'ease-in'}).finished.then(()=>{
    if(v._sw!==id)return;from.classList.remove('on');to.classList.add('on');
    to.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'});
  },()=>{});
}
/* 筛选条滑块：红色底块弹性滑到当前项 */
function pillTo(box,anim){
  const on=$('.chip.on',box);if(!on)return;let p=$('.cpill',box);
  if(!p){p=document.createElement('i');p.className='cpill';box.insertBefore(p,box.firstChild)}
  if(!on.offsetWidth)return;
  p.classList.toggle('mv',!!anim);p.style.setProperty('--px',on.offsetLeft+'px');p.style.setProperty('--pw',on.offsetWidth+'px');
  if(!p.classList.contains('rdy'))requestAnimationFrame(()=>p.classList.add('rdy'));
}
function initPills(root){$$('.chips',root).forEach(b=>pillTo(b,false))}
/* 单一 rAF 主循环：滚动进度 / 顶栏 / 跑马灯 / Hero 视差 */
const topEl=$('#top'),prog=$('#prog');
const cgl={el:$('#cglow'),x:0,y:0,tx:0,ty:0,on:false};
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!RM){cgl.on=true;window.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;if(!cgl.el.classList.contains('on')){cgl.x=cgl.tx=e.clientX;cgl.y=cgl.ty=e.clientY;cgl.el.classList.add('on')}cgl.tx=e.clientX;cgl.ty=e.clientY},{passive:true});document.documentElement.addEventListener('mouseleave',()=>cgl.el.classList.remove('on'))}
let last=performance.now(),lastY=scrollY,sv=0,sc=false,py=-1;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000)||.016;last=t;
  const y=scrollY;sv+=((y-lastY)/dt-sv)*Math.min(1,dt*9);lastY=y;
  if(y!==py){py=y;const s=sc?y>2:y>10;if(s!==sc){sc=s;topEl.classList.toggle('sc',s)}const mx=document.documentElement.scrollHeight-innerHeight;prog.style.transform=`scaleX(${mx>0?Math.min(1,y/mx).toFixed(4):0})`}
  if(!RM){
    const boost=Math.min(Math.abs(sv),2600)*.12,sk=Math.max(-7,Math.min(7,sv*-.006));
    for(const m of MQ){if(!m.vis||!m.w)continue;m.x+=m.dir*(m.sp+boost)*dt;if(m.dir<0){if(m.x<=-m.w)m.x+=m.w}else if(m.x>=0)m.x-=m.w;m.tr.style.transform=`translate3d(${m.x.toFixed(1)}px,0,0) skewX(${(sk*-m.dir).toFixed(2)}deg)`}
    if(PX.length&&y<900)for(const P of PX){const s=`translate3d(0,${(y*P.v).toFixed(1)}px,0)`;if(s!==P.s){P.s=s;P.e.style.transform=s}}
    if(cgl.on){cgl.x+=(cgl.tx-cgl.x)*.12;cgl.y+=(cgl.ty-cgl.y)*.12;cgl.el.style.transform=`translate3d(${cgl.x.toFixed(1)}px,${cgl.y.toFixed(1)}px,0)`}
    if(H&&H.vis){hp.x+=(hp.tx-hp.x)*.07;hp.y+=(hp.ty-hp.y)*.07;const yy=Math.min(y,800);
      for(const L of H.layers){const s=`translate3d(${(-hp.x*34*L.d).toFixed(1)}px,${(-hp.y*24*L.d+yy*.12*L.d).toFixed(1)}px,0)`;if(s!==L.s){L.s=s;L.l.style.transform=s}}}
  }
}

function mountView(n){
  const el=$(`.view[data-view="${n}"]`);el.innerHTML=VIEWS[n]();rendered.add(n);
  reveal(el);initMQ(el);initPills(el);PX=$$('.lay2',el).map(e=>({e,v:.28,s:''}));if(n==='home')initHero(el);else H=null;
}
function setView(n){
  $$('.view').forEach(v=>v.classList.toggle('on',v.dataset.view===n));
  const prev=cur;cur=n;document.title=TITLES[n];
  window.scrollTo(0,0);lastY=0;py=-1;
  mountView(n);setNav(n,!!prev);
}
/* 转场幕布：红色斜切扫屏（盖住 → 换页 → 揭开） */
const curtain=$('#curtain');let busy=false,pending=null;
const EI='cubic-bezier(.65,0,.35,1)',EO='cubic-bezier(.22,1,.36,1)',K=x=>`translateX(${x}%) skewX(-14deg)`;
async function runCurtain(n){
  busy=true;curtain.style.visibility='visible';setNav(n,true);
  const[a,b]=curtain.children;
  const i1=a.animate([{transform:K(-125)},{transform:K(0)}],{duration:270,easing:EI,fill:'forwards'});
  const i2=b.animate([{transform:K(-125)},{transform:K(0)}],{duration:270,delay:40,easing:EI,fill:'forwards'});
  await i2.finished;
  setView(n);
  const o2=b.animate([{transform:K(0)},{transform:K(125)}],{duration:430,easing:EO,fill:'forwards'});
  const o1=a.animate([{transform:K(0)},{transform:K(125)}],{duration:460,delay:60,easing:EO,fill:'forwards'});
  await o1.finished;
  [i1,i2,o1,o2].forEach(x=>x.cancel());curtain.style.visibility='hidden';busy=false;
  if(pending&&pending!==cur){const p=pending;pending=null;runCurtain(p)}else pending=null;
}
function route(){
  let n=(location.hash.replace(/^#\/?/,'')||'home').split('?')[0];if(!ROUTES.includes(n))n='home';
  closeSheet();closeSearch();
  if(!cur){setView(n);return}
  if(busy){pending=n;return}
  if(n===cur)return;
  if(RM||!Element.prototype.animate){setView(n);return}
  runCurtain(n);
}
window.addEventListener('hashchange',route);

/* ---------------- 桌面端 hover 倾斜 ---------------- */
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!RM){
  let tc=null,raf=0,ev=null;
  const reset=t=>{if(!t)return;t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg');t.classList.remove('hv')};
  document.addEventListener('pointermove',e=>{
    const t=e.target.closest?e.target.closest('.tilt'):null;
    if(t!==tc){reset(tc);tc=t;if(t){t.classList.add('hv');if(!t.querySelector(':scope>.spot')){const sp=document.createElement('i');sp.className='spot';t.appendChild(sp)}}}
    if(t){ev=e;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(!tc)return;const r=tc.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width-.5,py2=(ev.clientY-r.top)/r.height-.5;tc.style.setProperty('--mx',((px+.5)*r.width).toFixed(0)+'px');tc.style.setProperty('--my',((py2+.5)*r.height).toFixed(0)+'px');tc.style.setProperty('--ry',(px*9).toFixed(2)+'deg');tc.style.setProperty('--rx',(-py2*9).toFixed(2)+'deg')})}
  },{passive:true});
  document.documentElement.addEventListener('mouseleave',()=>{reset(tc);tc=null});
}

/* ---------------- 点击涟漪 ---------------- */
document.addEventListener('pointerdown',e=>{
  if(RM)return;const t=e.target.closest&&e.target.closest('.tile,.card,.ag,.mp,.ut,.btn');if(!t)return;
  const r=t.getBoundingClientRect(),d=document.createElement('i');d.className='rpl';
  d.style.setProperty('--x',(e.clientX-r.left)+'px');d.style.setProperty('--y',(e.clientY-r.top)+'px');
  t.appendChild(d);d.addEventListener('animationend',()=>d.remove());
},{passive:true});

/* ---------------- 空白处点击特效 ---------------- */
let tapN=0;
document.addEventListener('pointerdown',e=>{
  if(RM||tapN>5||e.button>0)return;
  if(e.target.closest&&e.target.closest('a,button,input,textarea,select,label,.tile,.card,.ag,.mp,.ut,.btn,.chip,.chips,.dock,.sheet'))return;
  tapN++;const w=document.createElement('div');w.className='tap';w.style.transform=`translate3d(${e.clientX}px,${e.clientY}px,0)`;
  const a0=Math.random()*60;let h='<i class="r1"></i><i class="r2"></i><i class="d"></i>';
  for(let k=0;k<6;k++)h+=`<i class="s" style="--a:${(a0+k*60).toFixed(0)}deg"></i>`;
  w.innerHTML=h;document.body.appendChild(w);setTimeout(()=>{w.remove();tapN--},1100);
},{passive:true});

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click',e=>{
  const navA=e.target.closest('a[data-h]');
  if(navA){
    const target=navA.dataset.h.slice(1);
    if(navA.closest('#dock')||navA.classList.contains('brand')){if(location.hash!==target)location.hash=target;return}
    if(navA.dataset.busy)return;
    navA.dataset.busy='1';navA.classList.add('pressing');
    setTimeout(()=>{navA.classList.remove('pressing');delete navA.dataset.busy;if(location.hash!==target)location.hash=target},140);
    return;
  }
  const t=e.target.closest('[data-open],[data-close],[data-login],[data-logout],[data-fav],[data-done],[data-go],[data-astep],[data-getcode],[data-doc],[data-tab-auth],[data-eye],[data-forgot],[data-oauth],.chip');
  if(!t)return;
  if(t.matches('[data-close]'))return closeSheet();
  if(t.dataset.open){closeSearch();return openDetail(t.dataset.open)}
  if(t.matches('[data-login]'))return openLogin();
  if(t.matches('[data-logout]')){Auth.logout().then(()=>{toast('已退出登录');location.hash='#/home'});return}
  if(t.dataset.go){location.hash='#/'+t.dataset.go;return}
  if(t.dataset.fav){const on=toggleList(FAV_KEY,t.dataset.fav);t.classList.toggle('on',on);$('span',t).textContent=on?'已收藏':'收藏';toast(on?'已加入收藏':'已取消收藏');return}
  if(t.dataset.done){const on=toggleList(DONE_KEY,t.dataset.done);t.classList.toggle('on',on);$('span',t).textContent=on?'已学习':'标记已学';toast(on?'已标记为已学习':'已取消标记');return}
  
  
  
  if(t.dataset.oauth)return doOauth(t.dataset.oauth,t);
  if(t.dataset.astep)return authGo(t.dataset.astep,-1);
  if(t.matches('[data-getcode]'))return getCode(t);
  if(t.dataset.doc){e.preventDefault();return toast('《'+t.dataset.doc+'》内容待补充')}
  if(t.classList.contains('chip')){
    const box=t.parentNode;
    if(box.matches('[data-tabs]')){$$('.chip',box).forEach(c=>c.classList.toggle('on',c===t));pillTo(box,true);t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});swapPanel(t.closest('.view'),t.dataset.tab);return}
    if(box.matches('[data-filter]')){
      $$('.chip',box).forEach(c=>c.classList.toggle('on',c===t));pillTo(box,true);t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
      const v=t.dataset.v,key=box.dataset.filter,grid=$(box.dataset.target);
      clearTimeout(grid._sw);grid.classList.add('swap');
      grid._sw=setTimeout(()=>{let k=0;
        $$('[data-'+key+']',grid).forEach(c=>{const hide=v!=='全部'&&c.dataset[key]!==v;c.classList.toggle('hidden',hide);if(!hide){c.style.setProperty('--i',Math.min(k++,7));c.style.animation='none';void c.offsetWidth;c.style.animation=''}});
        grid.classList.remove('swap')},150);
      const d=box.dataset.desc&&$(box.dataset.desc);if(d)d.textContent=v==='全部'?'选择职责，查看特工定位。':`${v}：${ROLES[v].d}`;
    }
  }
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-auth]');if(f){e.preventDefault();submitAuth(f)}});
document.addEventListener('input',e=>{if(e.target.id==='q')doSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeSearch()}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.h)e.target.click()});
/* ---------------- 搜索：顶栏变形为搜索框 ---------------- */
const sbar=$('#sbar'),qEl=$('#q'),HTMLEL=document.documentElement;let sOpen=false;
$('#sbarIc').innerHTML=ic('search');$('#sclear').innerHTML=ic('close');
function sbarGeom(){const b=$('#searchBtn');if(!b||!sbar)return;const br=b.getBoundingClientRect(),sr=sbar.getBoundingClientRect();if(!br.width||!sr.width)return;sbar.style.setProperty('--sl',Math.max(0,br.left-sr.left)+'px');sbar.style.setProperty('--sr',Math.max(0,sr.right-br.right)+'px')}
function spanelHTML(){
  const tags=[AGENTS[0]&&AGENTS[0].name,UTILS[0]&&UTILS[0].n,UTILS[1]&&UTILS[1].n,MAPS[0]&&MAPS[0].cn,MAPS[1]&&MAPS[1].cn,AGENTS[3]&&AGENTS[3].name,'经济'].filter(Boolean);
  return `<h6>热门搜索</h6><div class="stags">${tags.map((t,i)=>`<button class="stag" data-q="${esc(t)}" style="--i:${i}"><span style="display:inline-block;transform:skewX(12deg)">${esc(t)}</span></button>`).join('')}</div><h6>搜索结果</h6><div class="sres" id="sres"><p>输入关键词开始搜索</p></div>`;
}
function openSearch(){
  if(sOpen)return;sOpen=true;closeSheet();sbarGeom();
  $('#spi').innerHTML=spanelHTML();qEl.value='';sbar.classList.remove('has');
  HTMLEL.classList.add('srch','lock');$('#spanel').setAttribute('aria-hidden','false');
  try{qEl.focus({preventScroll:true})}catch(e){qEl.focus()}
}

  if(!sOpen)return;sOpen=false;HTMLEL.classList.remove('srch','lock');$('#spanel').setAttribute('aria-hidden','true');qEl.blur();
}
$('#searchBtn').addEventListener('click',openSearch);
$('#scancel').addEventListener('click',closeSearch);

qEl.addEventListener('input',()=>sbar.classList.toggle('has',!!qEl.value));
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')qEl.blur()});
$('#spanel').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;qEl.value=b.dataset.q;sbar.classList.add('has');doSearch(b.dataset.q)});
window.addEventListener('resize',()=>{if(!sOpen)sbarGeom()});
requestAnimationFrame(sbarGeom);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sbarGeom);
$('#loginBtn').addEventListener('click',()=>{Auth.user?(location.hash='#/me'):openLogin()});
let rz,rl;window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{MQ.forEach(m=>m.w=0);measureMQ();moveLens(false);$$('.chips').forEach(b=>pillTo(b,false))});clearTimeout(rl);rl=setTimeout(()=>{if($('#top').classList.contains('lg'))buildLG()},200)});


/* ---------------- 顶栏液态玻璃：生成边缘折射位移贴图 ----------------
   原理：SVG feDisplacementMap + backdrop-filter:url(#wys-lg)。
   位移贴图按像素计算：只在顶栏四周约 BW 像素的边缘带里把背景向外“鼓”出去，中间区域不变形。 */
const LG={AMP:16,BW:22};
function lgSupported(){try{return CSS.supports('backdrop-filter','url(#a)')||CSS.supports('-webkit-backdrop-filter','url(#a)')}catch(e){return false}}
function buildLG(){
  const top=$('#top'),svg=$('#wys-lg-svg');if(!top||!svg)return;
  const w=Math.round(top.offsetWidth),h=Math.round(top.offsetHeight);if(!w||!h)return;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d'),im=ctx.createImageData(w,h),d=im.data,{AMP,BW}=LG,scale=AMP*2;
  const f=v=>{const t=Math.max(0,Math.min(1,v/BW)),s=t*t*(3-2*t),k=1-s;return k*k};
  for(let y=0;y<h;y++){const ft=f(y+.5),fb=f(h-y-.5);
    for(let x=0;x<w;x++){const i=(y*w+x)*4;
      const sx=(f(x+.5)-f(w-x-.5))*AMP,sy=(ft-fb)*AMP;
      d[i]=Math.max(0,Math.min(255,Math.round(128+sx/scale*255)));d[i+1]=Math.max(0,Math.min(255,Math.round(128+sy/scale*255)));d[i+2]=128;d[i+3]=255}}
  ctx.putImageData(im,0,0);
  const flt=$('filter',svg),fi=$('feImage',svg),fd=$('feDisplacementMap',svg),url=cv.toDataURL();
  flt.setAttribute('width',w);flt.setAttribute('height',h);fi.setAttribute('width',w);fi.setAttribute('height',h);
  fi.setAttribute('href',url);fi.setAttributeNS('http://www.w3.org/1999/xlink','href',url);fd.setAttribute('scale',scale);
}
function initLG(){if(!lgSupported())return;buildLG();$('#top').classList.add('lg')}

/* ---------------- 启动 ---------------- */
initLG();
refreshAuthUI();
const INTRO=document.documentElement.classList.contains('introing');
const boot=()=>{route();requestAnimationFrame(()=>moveLens(false))};
requestAnimationFrame(frame);
if(INTRO){try{sessionStorage.setItem('wys_i','1')}catch(e){}setTimeout(boot,1000);setTimeout(()=>{document.documentElement.classList.remove('introing');const i=$('#intro');i&&i.remove()},2300)}
else{boot();const i=$('#intro');i&&i.remove()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{MQ.forEach(m=>m.w=0);measureMQ();moveLens(false);$$('.chips').forEach(b=>pillTo(b,false))});
Auth.restore();
Auth.handleCallback().then(r=>{if(r&&r.needBind)openBind();else if(r&&r.user)toast(r.isNew?'欢迎加入瓦研社':'登录成功，欢迎回来')}).catch(e=>toast(e.message||'登录失败'));
window.WYS={Auth,CONFIG,openLogin,toast,data:{AGENTS,MAPS,UTILS,ECO,ARTICLES}};
})();
